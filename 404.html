<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Famille Cochin</title>
    <!-- famille.cochin.fr became cochin.fr: every address, with its path and its #personne/… anchor, goes to the same place there -->
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://cochin.fr/" />
    <script>
      location.replace('https://cochin.fr' + location.pathname + location.search + location.hash)
    </script>
    <meta http-equiv="refresh" content="1; url=https://cochin.fr/" />
  </head>
  <body>
    <p><a href="https://cochin.fr/">cochin.fr</a></p>
  </body>
</html>
